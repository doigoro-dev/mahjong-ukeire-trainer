<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>麻雀 受け入れ枚数トレーナー</title>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main>
    <h1>麻雀 受け入れ枚数トレーナー</h1>

    <div id="question-info"></div>

    <div id="hand" class="hand"></div>

    <section class="answer-section">
      <h2>受け入れ牌を選んでください</h2>

      <div id="tile-selector" class="tile-selector"></div>

      <p>
        選択中：
        <span id="selected-count">0</span>種
      </p>

      <div class="count-answer">
        <label>
          受け入れ枚数：
          <input id="answer-count" type="number" min="0" max="136">
          枚
        </label>
      </div>

      <button id="answer-button" type="button">
        回答する
      </button>

      <div id="answer-preview"></div>

      <button id="next-button" type="button" hidden>
        次の問題
      </button>
    </section>
  </main>

  <script src="js/questions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
